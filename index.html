<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0014" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>EXO AI Assistant</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg"></div>
  <div class="gridGlow"></div>

  <main class="wrap">

    <header class="hero">
      <div class="brand">
        <div class="mark">EXO</div>
        <div class="brandText">
          <div class="brandTitle">EXO AI Assistant</div>
          <div class="brandSub">
            <span class="dotLive"></span>
            <span id="liveText">Online</span>
            <span class="sep">•</span>
            Invite-only Beta
          </div>
        </div>
      </div>

      <div class="heroActions">
        <button class="btnSmall" id="togglePresetsBtn">Presets</button>
      </div>
    </header>

    <!-- INVITE GATE -->
    <section class="card gate" id="gateCard">
      <h2>Enter invite code</h2>
      <p class="hint">You need a valid invite code to use the assistant.</p>

      <div class="form">
        <label class="field">
          <span>Invite code</span>
          <input id="inviteInput" placeholder="e.g. EXO-7F3K-92Q" autocapitalize="characters" />
        </label>

        <div class="actions">
          <button class="btnPrimary" id="unlockBtn">Unlock</button>
          <button class="btnGhost" id="clearBtn">Clear</button>
        </div>

        <div class="error" id="gateError"></div>
      </div>
    </section>

    <!-- APP -->
    <section class="card app hidden" id="appCard">
      <div class="appTop">
        <div class="pill">
          <span class="miniDot"></span>
          <span id="pillText">Ready</span>
        </div>

        <div style="display:flex; gap:10px; align-items:center;">
          <button class="btnSmall" id="clearChatBtn">Clear chat</button>
          <button class="btnSmall" id="logoutBtn">Remove invite</button>
        </div>
      </div>

      <!-- Presets drawer -->
      <div class="presetWrap hidden" id="presetWrap">
        <div class="presetHeader">
          <div class="presetTitle">Quick presets</div>
          <button class="btnSmall" id="closePresetsBtn">Close</button>
        </div>

        <div class="presetGrid" id="presetGrid"></div>

        <div class="hint presetHint">
          Tip: pick a preset, then type your message normally.
        </div>
      </div>

      <div class="chat" id="chat"></div>

      <div class="composer">
        <div class="presetLine" id="presetLine">Preset: <b>None</b></div>
        <div class="composerRow">
          <input id="msg" placeholder="Ask EXO…" />
          <button class="send" id="sendBtn" aria-label="Send">
            <span>Send</span>
            <span class="sendArrow">➜</span>
          </button>
        </div>
      </div>

      <div class="statusLine" id="statusLine"></div>
    </section>

    <footer class="foot">
      <small>Private access • Presets • Saved locally on device</small>
    </footer>
  </main>

  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

    const API_BASE = "https://exo-ai-invite.exoware312.workers.dev";

    const KEY_INVITE = "exo_invite_code";

const PRESETS = [
  { id:"none", label:"Normal", preface:"" },

  { id:"support", label:"Support Reply", preface:
    "Write a helpful customer support reply for ExoBoostX. Be polite, clear, and reassure the customer. Ask 1–2 key questions if needed.\n\n" },

  { id:"service", label:"Service Explainer", preface:
    "Explain the ExoBoostX service in a clear, trustworthy way (what it is, what the customer provides, what they receive, typical delivery expectations). Avoid making unrealistic promises.\n\n" },

  { id:"discord", label:"Discord Post", preface:
    "Write a Discord-ready post for ExoBoostX using clean formatting (headings, bullets, emojis). Keep it short and professional.\n\n" },

  { id:"faq", label:"FAQ Answer", preface:
    "Answer as ExoBoostX AI. Provide an FAQ-style response, include steps if relevant, and end with a quick next action.\n\n" },

  { id:"policy", label:"Policy/Refund", preface:
    "Write a clear ExoBoostX policy message (refunds, delivery, replacements). Keep it fair, specific, and easy to understand.\n\n" },

  { id:"offer", label:"Offer Copy", preface:
    "Write promotional copy for ExoBoostX that is trustworthy and compliant. No spammy wording. Include a CTA.\n\n" },

  { id:"onboard", label:"New Customer Onboarding", preface:
    "Create a short onboarding message for a new ExoBoostX customer: steps to order, what info is needed, expectations, and support contact.\n\n" }
];


    // History: per invite
    const HISTORY_MAX = 80;
    function historyKey(invite){
      const safeInvite = (invite || "none").toUpperCase().replace(/[^A-Z0-9\-]/g, "");
      return `exo_chat_${safeInvite}`;
    }
    function loadHistory(invite){
      try {
        const raw = localStorage.getItem(historyKey(invite));
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      } catch { return []; }
    }
    function saveHistory(invite, arr){
      try {
        localStorage.setItem(historyKey(invite), JSON.stringify(arr.slice(-HISTORY_MAX)));
      } catch {}
    }
    function clearHistory(invite){
      try { localStorage.removeItem(historyKey(invite)); } catch {}
    }

    // UI
    const gateCard = document.getElementById("gateCard");
    const appCard = document.getElementById("appCard");
    const inviteInput = document.getElementById("inviteInput");
    const gateError = document.getElementById("gateError");

    const chat = document.getElementById("chat");
    const msg = document.getElementById("msg");
    const statusLine = document.getElementById("statusLine");
    const pillText = document.getElementById("pillText");

    const presetWrap = document.getElementById("presetWrap");
    const presetGrid = document.getElementById("presetGrid");
    const presetLine = document.getElementById("presetLine");

    // Presets (universal)
    const PRESETS = [
      { id:"none", label:"None", preface:"" },
      { id:"explain", label:"Explain", preface:"Explain this clearly like I'm smart but new to it. Use an analogy and a simple example.\n\n" },
      { id:"summarise", label:"Summarise", preface:"Summarise this into key bullet points. Then give a 1-sentence takeaway.\n\n" },
      { id:"rewrite", label:"Rewrite", preface:"Rewrite this to be clearer and more polished. Keep the meaning the same.\n\n" },
      { id:"brainstorm", label:"Brainstorm", preface:"Brainstorm 10 strong ideas. Make them varied and practical.\n\n" },
      { id:"plan", label:"Plan", preface:"Create a step-by-step plan with milestones, time estimates, and next actions.\n\n" },
      { id:"code", label:"Code help", preface:"Help me with this code. Explain the issue, then show a corrected version.\n\n" },
      { id:"email", label:"Email", preface:"Draft a professional email. Provide 2 tone options (neutral + friendly).\n\n" },
      { id:"study", label:"Study", preface:"Teach me this like a tutor: quick explanation, then 5 questions to test me.\n\n" }
    ];

    let activePreset = PRESETS[0]; // none

    function setPreset(id){
      activePreset = PRESETS.find(p => p.id === id) || PRESETS[0];
      presetLine.innerHTML = `Preset: <b>${activePreset.label}</b>`;
      pillText.textContent = activePreset.id === "none" ? "Ready" : `Preset: ${activePreset.label}`;
      [...presetGrid.querySelectorAll(".presetBtn")].forEach(b => {
        b.classList.toggle("active", b.dataset.pid === activePreset.id);
      });
    }

    function showGate(err="") {
      gateCard.classList.remove("hidden");
      appCard.classList.add("hidden");
      gateError.textContent = err;
    }
    function showApp() {
      gateCard.classList.add("hidden");
      appCard.classList.remove("hidden");
      gateError.textContent = "";
      statusLine.textContent = "";
    }

    function toast(msgText){
      const t = document.createElement("div");
      t.className = "toast";
      t.textContent = msgText;
      document.body.appendChild(t);
      setTimeout(()=>t.classList.add("show"), 10);
      setTimeout(()=>{ t.classList.remove("show"); setTimeout(()=>t.remove(), 250); }, 1200);
    }

    function addBubble(text, who="ai", skipSave=false) {
      const wrap = document.createElement("div");
      wrap.className = `bubbleWrap ${who}`;

      const b = document.createElement("div");
      b.className = `bubble ${who}`;
      b.textContent = text;
      wrap.appendChild(b);

      if (who === "ai") {
        const actions = document.createElement("div");
        actions.className = "bubbleActions";

        const copy = document.createElement("button");
        copy.className = "act";
        copy.textContent = "Copy";
        copy.onclick = async () => {
          try { await navigator.clipboard.writeText(text); toast("Copied ✅"); }
          catch { toast("Copy blocked on iOS"); }
        };

        actions.appendChild(copy);
        wrap.appendChild(actions);
      }

      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;

      if (!skipSave) {
        const invite = localStorage.getItem(KEY_INVITE) || "";
        if (invite) {
          const hist = loadHistory(invite);
          hist.push({ who, text, t: Date.now() });
          saveHistory(invite, hist);
        }
      }
      return wrap;
    }

    function addTyping() {
      const wrap = document.createElement("div");
      wrap.className = "bubbleWrap ai";
      wrap.id = "typing";

      const b = document.createElement("div");
      b.className = "bubble ai typing";
      b.innerHTML = `<span class="td"></span><span class="td"></span><span class="td"></span>`;
      wrap.appendChild(b);

      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
    }
    function removeTyping() {
      const t = document.getElementById("typing");
      if (t) t.remove();
    }

    function renderHistory(invite){
      chat.innerHTML = "";
      const hist = loadHistory(invite);
      if (hist.length === 0) {
        addBubble("Welcome. Use Presets if you want quick formatting — or just ask anything.", "ai", true);
        return;
      }
      hist.forEach(m => addBubble(m.text, m.who, true));
      chat.scrollTop = chat.scrollHeight;
    }

    async function validateInvite(code) {
      const res = await fetch(API_BASE + "/validate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code })
      });
      if (!res.ok) throw new Error("Invalid code");
      return res.json();
    }

    async function sendToAI(promptText) {
      const code = localStorage.getItem(KEY_INVITE) || "";
      const finalPrompt = (activePreset.preface || "") + promptText;

      const res = await fetch(API_BASE + "/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Invite": code
        },
        body: JSON.stringify({ prompt: finalPrompt })
      });

      if (!res.ok) {
        const t = await res.text().catch(()=> "");
        throw new Error(t || "Request failed");
      }
      return res.json();
    }

    // Build preset UI
    presetGrid.innerHTML = PRESETS.map(p => `
      <button class="presetBtn ${p.id==="none" ? "active":""}" data-pid="${p.id}">
        ${p.label}
      </button>
    `).join("");

    presetGrid.addEventListener("click", (e) => {
      const b = e.target.closest(".presetBtn");
      if (!b) return;
      setPreset(b.dataset.pid);
      toast(`Preset: ${activePreset.label}`);
    });

    // Presets toggle
    function togglePresets(force){
      const show = typeof force === "boolean" ? force : presetWrap.classList.contains("hidden");
      presetWrap.classList.toggle("hidden", !show);
      if (show) presetWrap.scrollIntoView({behavior:"smooth", block:"start"});
    }

    document.getElementById("togglePresetsBtn").onclick = () => togglePresets();
    document.getElementById("closePresetsBtn").onclick = () => togglePresets(false);

    // Gate buttons
    document.getElementById("unlockBtn").onclick = async () => {
      const code = (inviteInput.value || "").trim().toUpperCase();
      if (!code) return showGate("Enter an invite code.");

      gateError.textContent = "Checking…";
      try {
        await validateInvite(code);
        localStorage.setItem(KEY_INVITE, code);
        showApp();
        renderHistory(code);
        toast("Invite verified ✅");
      } catch {
        showGate("That code didn’t work (or it’s expired).");
      }
    };

    document.getElementById("clearBtn").onclick = () => {
      inviteInput.value = "";
      gateError.textContent = "";
    };

    document.getElementById("logoutBtn").onclick = () => {
      localStorage.removeItem(KEY_INVITE);
      showGate("Invite removed.");
    };

    document.getElementById("clearChatBtn").onclick = () => {
      const invite = localStorage.getItem(KEY_INVITE);
      if (!invite) return;
      const ok = confirm("Clear chat history on this device?");
      if (!ok) return;
      clearHistory(invite);
      renderHistory(invite);
      toast("Chat cleared 🧼");
    };

    // Send
    async function handleSend() {
      const text = (msg.value || "").trim();
      if (!text) return;

      msg.value = "";
      addBubble(text, "me");
      statusLine.textContent = "EXO is thinking…";
      addTyping();

      try {
        const data = await sendToAI(text);
        removeTyping();
        addBubble(data.answer || "(No answer returned)", "ai");
        statusLine.textContent = "";
      } catch (e) {
        removeTyping();
        statusLine.textContent = "Error: " + String(e.message || "Request failed").slice(0, 140);
        if (String(e.message || "").toLowerCase().includes("invite")) {
          showGate("Invite rejected. Enter a valid code.");
        }
      }
    }

    document.getElementById("sendBtn").onclick = handleSend;
    msg.addEventListener("keydown", (e) => { if (e.key === "Enter") handleSend(); });

    // Boot
    setPreset("none");
    const existing = localStorage.getItem(KEY_INVITE);
    if (existing) {
      showApp();
      renderHistory(existing);
    } else {
      showGate("");
    }
  </script>
</body>
</html>
