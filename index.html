<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0014" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>EXO Pocket</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">

  <!-- If you add your own icon later, also add:
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  -->
</head>
<body>
  <div class="bg"></div>

  <main class="wrap">
    <header class="top">
      <div class="logo">EXO</div>
      <div class="title">
        <h1>EXO Pocket</h1>
        <p class="sub">Powering Growth, One Click at a Time</p>
      </div>
    </header>

    <section class="card">
      <h2>Quick Actions</h2>
      <div class="grid">
        <button class="btn" id="btn1">Open Dashboard</button>
        <button class="btn" id="btn2">Services</button>
        <button class="btn" id="btn3">Orders</button>
        <button class="btn" id="btn4">Settings</button>
      </div>
    </section>

    <section class="card">
      <h2>Status</h2>
      <div class="status">
        <div class="pill"><span class="dot"></span> Online</div>
        <div class="pill">Local Mode</div>
        <div class="pill" id="clock">--:--</div>
      </div>
      <p class="hint">This is a starter “app shell”. Next we can add pages, login, Firestore, etc.</p>
    </section>

    <footer class="foot">
      <small>Installed like an app • Works offline</small>
    </footer>
  </main>

  <script>
    // Register service worker (offline support)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    // Simple clock
    const clock = document.getElementById('clock');
    const tick = () => {
      const d = new Date();
      clock.textContent = d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    };
    tick(); setInterval(tick, 1000);

    // Demo buttons
    const toast = (msg) => {
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.classList.add('show'), 10);
      setTimeout(() => { t.classList.remove('show'); setTimeout(()=>t.remove(), 250); }, 1600);
    };

    document.getElementById('btn1').onclick = () => toast('Dashboard (coming next)');
    document.getElementById('btn2').onclick = () => toast('Services (coming next)');
    document.getElementById('btn3').onclick = () => toast('Orders (coming next)');
    document.getElementById('btn4').onclick = () => toast('Settings (coming next)');
  </script>
</body>
</html>
