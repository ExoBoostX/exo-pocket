<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0014" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Boost Empire</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg"></div>

  <main class="wrap">

    <header class="top">
      <div class="logo">EXO</div>
      <div class="title">
        <h1>Boost Empire</h1>
        <p class="sub">Build Your Growth Machine</p>
      </div>
    </header>

    <section class="card">
      <h2>Your Empire</h2>

      <div class="stat">
        <div class="statLabel">Coins</div>
        <div class="statValue" id="coins">0</div>
      </div>

      <div class="stat">
        <div class="statLabel">Coins Per Second</div>
        <div class="statValue" id="cps">0</div>
      </div>

      <button class="boostBtn" id="boostBtn">🚀 BOOST</button>
    </section>

    <section class="card">
      <h2>Upgrades</h2>
      <div class="upgradeList" id="upgradeList"></div>
    </section>

  </main>

<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

let coins = 0;
let cps = 0;

const upgrades = [
  { name: "Instagram Bot", cost: 50, power: 1, owned: 0 },
  { name: "TikTok Engine", cost: 200, power: 5, owned: 0 },
  { name: "Discord Blaster", cost: 500, power: 12, owned: 0 },
  { name: "AI Growth Core", cost: 1500, power: 35, owned: 0 },
  { name: "Viral Algorithm", cost: 5000, power: 100, owned: 0 }
];

const coinsEl = document.getElementById("coins");
const cpsEl = document.getElementById("cps");
const upgradeList = document.getElementById("upgradeList");

function updateUI() {
  coinsEl.textContent = Math.floor(coins);
  cpsEl.textContent = cps;
  renderUpgrades();
}

function renderUpgrades() {
  upgradeList.innerHTML = upgrades.map((u, i) => `
    <button class="upgradeBtn" onclick="buyUpgrade(${i})">
      <div>
        <div class="rowTitle">${u.name}</div>
        <div class="rowSub">Owned: ${u.owned}</div>
      </div>
      <div class="rowRight">💰 ${u.cost}</div>
    </button>
  `).join("");
}

function buyUpgrade(index) {
  const u = upgrades[index];
  if (coins >= u.cost) {
    coins -= u.cost;
    u.owned++;
    cps += u.power;
    u.cost = Math.floor(u.cost * 1.6);
    updateUI();
  }
}

document.getElementById("boostBtn").addEventListener("click", () => {
  coins += 1;
  updateUI();
});

setInterval(() => {
  coins += cps;
  updateUI();
}, 1000);

updateUI();
</script>

</body>
</html>
