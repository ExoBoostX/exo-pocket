<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0014" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>EXO AI Assistant</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg"></div>

  <main class="wrap">
    <header class="top">
      <div class="logo">EXO</div>
      <div class="title">
        <h1>EXO AI Assistant</h1>
        <p class="sub">Invite-only access</p>
      </div>
    </header>

    <!-- INVITE GATE -->
    <section class="card" id="gateCard">
      <h2>Enter invite code</h2>
      <p class="hint">You need a valid invite code to use the assistant.</p>

      <div class="form">
        <label class="field">
          <span>Invite code</span>
          <input id="inviteInput" placeholder="e.g. EXO-7F3K-92Q" autocapitalize="characters" />
        </label>

        <div class="actions">
          <button class="btnPrimary" id="unlockBtn">Unlock</button>
          <button class="btnGhost" id="clearBtn">Clear</button>
        </div>

        <div class="error" id="gateError"></div>
      </div>
    </section>

    <!-- APP -->
    <section class="card hidden" id="appCard">
      <div class="outTop">
        <h2>Chat</h2>
        <button class="btnSmall" id="logoutBtn">Remove invite</button>
      </div>

      <div class="chat" id="chat"></div>

      <div class="composer">
        <input id="msg" placeholder="Ask anything…" />
        <button class="btnPrimary" id="sendBtn">Send</button>
      </div>

      <div class="hint" id="statusLine"></div>
    </section>

    <footer class="foot">
      <small>Powered by your backend • Don’t share your invite</small>
    </footer>
  </main>

  <script>
    // PWA offline shell
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

    // 🔧 IMPORTANT: put your Worker URL here (example):
    // const API_BASE = "https://exo-ai.yourname.workers.dev";
    const API_BASE = "https://exo-ai-invite.exoware312.workers.dev";

    const KEY_INVITE = "exo_invite_code";

    const gateCard = document.getElementById("gateCard");
    const appCard = document.getElementById("appCard");
    const inviteInput = document.getElementById("inviteInput");
    const gateError = document.getElementById("gateError");

    const chat = document.getElementById("chat");
    const msg = document.getElementById("msg");
    const statusLine = document.getElementById("statusLine");

    function showGate(err="") {
      gateCard.classList.remove("hidden");
      appCard.classList.add("hidden");
      gateError.textContent = err;
    }
    function showApp() {
      gateCard.classList.add("hidden");
      appCard.classList.remove("hidden");
      gateError.textContent = "";
      statusLine.textContent = "";
    }

    function addBubble(text, who="ai") {
      const div = document.createElement("div");
      div.className = "bubble " + who;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function validateInvite(code) {
      const res = await fetch(API_BASE + "/validate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code })
      });
      if (!res.ok) {
        const t = await res.text().catch(()=> "");
        throw new Error(t || "Invalid code");
      }
      return res.json();
    }

    async function sendToAI(promptText) {
      const code = localStorage.getItem(KEY_INVITE) || "";
      const res = await fetch(API_BASE + "/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Invite": code
        },
        body: JSON.stringify({ prompt: promptText })
      });

      if (!res.ok) {
        const t = await res.text().catch(()=> "");
        throw new Error(t || "Request failed");
      }
      return res.json();
    }

    document.getElementById("unlockBtn").onclick = async () => {
      const code = (inviteInput.value || "").trim().toUpperCase();
      if (!code) return showGate("Enter an invite code.");

      gateError.textContent = "Checking…";
      try {
        await validateInvite(code);
        localStorage.setItem(KEY_INVITE, code);
        showApp();
        addBubble("Access granted. What do you want help with?", "ai");
      } catch (e) {
        showGate("That code didn’t work (or it’s expired).");
      }
    };

    document.getElementById("clearBtn").onclick = () => {
      inviteInput.value = "";
      gateError.textContent = "";
    };

    document.getElementById("logoutBtn").onclick = () => {
      localStorage.removeItem(KEY_INVITE);
      showGate("Invite removed.");
    };

    async function handleSend() {
      const text = (msg.value || "").trim();
      if (!text) return;
      msg.value = "";

      addBubble(text, "me");
      statusLine.textContent = "Thinking…";

      try {
        const data = await sendToAI(text);
        addBubble(data.answer || "(No answer returned)", "ai");
        statusLine.textContent = "";
      } catch (e) {
        statusLine.textContent = "Error: " + (e.message || "Request failed");
        if ((e.message || "").toLowerCase().includes("invite")) {
          showGate("Invite rejected. Enter a valid code.");
        }
      }
    }

    document.getElementById("sendBtn").onclick = handleSend;
    msg.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleSend();
    });

    // boot
    const existing = localStorage.getItem(KEY_INVITE);
    if (existing) {
      showApp();
      addBubble("Welcome back. Ask me anything.", "ai");
    } else {
      showGate("");
    }
  </script>
</body>
</html>
